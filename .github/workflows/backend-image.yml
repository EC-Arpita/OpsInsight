# Builds the backend container and pushes it to Docker Hub (no Docker needed on your laptop).
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
name: Backend image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["api/**", "contracts/**", "models/**", "requirements.txt", "Dockerfile"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/opsinsight-api:latest
